name: linux-precompile

on:
  push:
    tags:
      - 'v*'
      - 'precompile-test'
      - 'precompile-test-linux'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  precompile:
    runs-on: ubuntu-latest
    env:
      ImageOS: ubuntu20
      LANG: en_US.UTF-8
      LANGUAGE: en_US:en
      LC_ALL: en_US.UTF-8
      DEBIAN_FRONTEND: noninteractive
      MIX_ENV: prod
      TFLITE_BEAM_PREFER_PRECOMPILED: "false"
      ARMV6_TOOLCHAIN_NAME: "nerves_toolchain_armv6_nerves_linux_gnueabihf-linux_x86_64"
      ARMV6_TOOLCHAIN_VERSION: "14.2.0"
      ARMV6_TOOLCHAIN_HASH: "11156D8"
      RISCV64_TOOLCHAIN_NAME: "nerves_toolchain_riscv64_nerves_linux_gnu-linux_x86_64"
      RISCV64_TOOLCHAIN_VERSION: "14.2.0"
      RISCV64_TOOLCHAIN_HASH: "D43CCBE"
    container: ubuntu:20.04

    name: ${{ matrix.pair.target_arch }}-${{ matrix.pair.target_os }}-${{ matrix.pair.target_abi }} - OTP ${{ matrix.pair.otp }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # remember to change the `get_precompiled_nif_version/0` function in the `tflite_beam_precompiled` file
          # if upgrade the Erlang/OTP version to 26.x or later
          # 2.16 for OTP 24.x and 25.x
          # 2.17 for OTP 26.x
          - pair:
              otp: "25.x"
              arch_name: x86_64
              cmake_toolchain_file: ""
              # gcc-10, not focal's default 9: the abseil LiteRT pins refuses
              # anything below 10. Staying on focal is what keeps this artifact
              # asking for no more than glibc 2.29, which it has since v0.3.12.
              c_compiler: gcc-10
              cpp_compiler: g++-10
              libedgetpu_library: "x86_64"
              target_arch: "x86_64"
              target_os: "linux"
              target_abi: "gnu"
              cc: "/usr/bin/gcc-10"
              cxx: "/usr/bin/g++-10"
          - pair:
              otp: "25.x"
              arch_name: aarch64
              cmake_toolchain_file: cc_toolchain/aarch64-linux-gnu.cmake
              c_compiler: gcc-aarch64-linux-gnu
              cpp_compiler: g++-aarch64-linux-gnu
              libedgetpu_library: "aarch64"
              target_arch: "aarch64"
              target_os: "linux"
              target_abi: "gnu"
              cc: "/usr/bin/aarch64-linux-gnu-gcc"
              cxx: "/usr/bin/aarch64-linux-gnu-g++"
          - pair:
              otp: "25.x"
              arch_name: armv7l
              cmake_toolchain_file: cc_toolchain/armv7l-linux-gnueabihf.cmake
              # see the note on x86_64 above. The Nerves armv7 toolchain would
              # also satisfy abseil but links against glibc 2.38, and Raspberry
              # Pi OS Bookworm has 2.36.
              c_compiler: gcc-10-arm-linux-gnueabihf
              cpp_compiler: g++-10-arm-linux-gnueabihf
              libedgetpu_library: "armv7l"
              target_arch: "armv7l"
              target_os: "linux"
              target_abi: "gnueabihf"
              cc: "/usr/bin/arm-linux-gnueabihf-gcc-10"
              cxx: "/usr/bin/arm-linux-gnueabihf-g++-10"
          - pair:
              otp: "25.x"
              arch_name: armv6
              cmake_toolchain_file: cc_toolchain/armv6-nerves-linux-gnueabihf.cmake
              c_compiler: armv6-nerves-linux-gnueabihf-gcc
              cpp_compiler: armv6-nerves-linux-gnueabihf-g++
              libedgetpu_library: "armv6"
              target_arch: "armv6"
              target_os: "linux"
              target_abi: "gnueabihf"
              cc: "armv6-nerves-linux-gnueabihf-gcc"
              cxx: "armv6-nerves-linux-gnueabihf-g++"
          - pair:
              otp: "25.x"
              arch_name: riscv64
              cmake_toolchain_file: cc_toolchain/riscv64-nerves-linux-gnu.cmake
              c_compiler: riscv64-nerves-linux-gnu-gcc
              cpp_compiler: riscv64-nerves-linux-gnu-g++
              libedgetpu_library: "riscv64"
              target_arch: "riscv64"
              target_os: "linux"
              target_abi: "gnu"
              cc: "riscv64-nerves-linux-gnu-gcc"
              cxx: "riscv64-nerves-linux-gnu-g++"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.pair.otp }}
          rebar3-version: "3.24.0"

      - name: Install system dependecies
        run: |
          apt-get update
          apt-get install -y build-essential automake autoconf pkg-config bc m4 unzip zip curl git libssl-dev gzip libncurses5-dev ca-certificates python3 xz-utils
          if [ "${{ matrix.pair.arch_name }}" = "aarch64" ]; then
            sed -i 's/focal/jammy/g' /etc/apt/sources.list
            apt-get update
          fi
          if [ "${{ matrix.pair.arch_name }}" = "armv6" ]; then
            curl -fSL https://github.com/nerves-project/toolchains/releases/download/v${ARMV6_TOOLCHAIN_VERSION}/${ARMV6_TOOLCHAIN_NAME}-${ARMV6_TOOLCHAIN_VERSION}-11156D8.tar.xz -o ${ARMV6_TOOLCHAIN_NAME}-${ARMV6_TOOLCHAIN_VERSION}-${ARMV6_TOOLCHAIN_HASH}.tar.xz
            tar -xf ${ARMV6_TOOLCHAIN_NAME}-${ARMV6_TOOLCHAIN_VERSION}-${ARMV6_TOOLCHAIN_HASH}.tar.xz
            mv ${ARMV6_TOOLCHAIN_NAME}-${ARMV6_TOOLCHAIN_VERSION} /usr/local/bin/${ARMV6_TOOLCHAIN_NAME}-${ARMV6_TOOLCHAIN_VERSION}
          elif [ "${{ matrix.pair.arch_name }}" = "riscv64" ]; then
            curl -fSL https://github.com/nerves-project/toolchains/releases/download/v14.2.0/${RISCV64_TOOLCHAIN_NAME}-${RISCV64_TOOLCHAIN_VERSION}-${RISCV64_TOOLCHAIN_HASH}.tar.xz -o ${RISCV64_TOOLCHAIN_NAME}-${RISCV64_TOOLCHAIN_VERSION}-${RISCV64_TOOLCHAIN_HASH}.tar.xz
            tar -xf ${RISCV64_TOOLCHAIN_NAME}-${RISCV64_TOOLCHAIN_VERSION}-${RISCV64_TOOLCHAIN_HASH}.tar.xz
            mv ${RISCV64_TOOLCHAIN_NAME}-${RISCV64_TOOLCHAIN_VERSION} /usr/local/bin/${RISCV64_TOOLCHAIN_NAME}-${RISCV64_TOOLCHAIN_VERSION}
          else
            apt-get install -y ${{ matrix.pair.c_compiler }} ${{ matrix.pair.cpp_compiler }}
          fi

          curl -fSL https://github.com/Kitware/CMake/releases/download/v3.22.6/cmake-3.22.6-linux-$(uname -m).tar.gz -o /tmp/cmake.tar.gz
          tar -xzf /tmp/cmake.tar.gz --strip-components=1 -C /usr/local

          git clone https://github.com/google/flatbuffers.git
          cd flatbuffers/
          git checkout v25.9.23
          cmake -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release
          make
          make install

      - name: Create precompiled library
        run: |
          export NIF_VERSION="$(erl -noshell -eval "io:format('~ts', [erlang:system_info(nif_version)])." -s erlang halt)"
          # x86_64 has no toolchain file, and CC/CXX used to be exported only
          # for the targets that did. It therefore built with whatever gcc the
          # image called default, which on focal is 9, below what the abseil
          # LiteRT pins accepts.
          if [ "${{ matrix.pair.cc }}" != "" ]; then
            export CC="${{ matrix.pair.cc }}"
            export CXX="${{ matrix.pair.cxx }}"
          fi

          if [ "${{ matrix.pair.cmake_toolchain_file }}" != "" ]; then
            export CMAKE_TOOLCHAIN_FILE="$(pwd)/${{ matrix.pair.cmake_toolchain_file }}"
            export TARGET_ARCH="${{ matrix.pair.target_arch }}"
            export TARGET_OS="${{ matrix.pair.target_os }}"
            export TARGET_ABI="${{ matrix.pair.target_abi }}"
            export TFLITE_BEAM_CORAL_LIBEDGETPU_LIBRARIES="${{ matrix.pair.libedgetpu_library }}"
          fi

          if [ "${{ matrix.pair.arch_name }}" = "armv6" ]; then
            # No -fPIE or -pie here: the Nerves flag set they come from builds
            # executables, and they are what makes armv6 emit local-exec TLS that
            # a shared object may not contain. CMakeLists strips them anyway, so
            # this is the honest version of the same thing rather than the guard.
            export TARGET_GCC_FLAGS="-mabi=aapcs-linux -mfpu=vfp -marm -fstack-protector-strong -mfloat-abi=hard -mcpu=arm1176jzf-s -Wl,-z,now -Wl,-z,relro"
            export PATH="/usr/local/bin/${ARMV6_TOOLCHAIN_NAME}-${ARMV6_TOOLCHAIN_VERSION}/bin/:${PATH}"
          elif [ "${{ matrix.pair.arch_name }}" = "riscv64" ]; then
            export PATH="/usr/local/bin/${RISCV64_TOOLCHAIN_NAME}-${RISCV64_TOOLCHAIN_VERSION}/bin/:${PATH}"
          fi

          echo "CMAKE_TOOLCHAIN_FILE: ${CMAKE_TOOLCHAIN_FILE}"
          echo "TFLITE_BEAM_CORAL_LIBEDGETPU_LIBRARIES: ${TFLITE_BEAM_CORAL_LIBEDGETPU_LIBRARIES}"
          echo "TFLITE_BEAM_PREFER_PRECOMPILED: ${TFLITE_BEAM_PREFER_PRECOMPILED}"
          echo "CC: ${CC}"
          echo "CXX: ${CXX}"
          echo "TARGET_ARCH: ${TARGET_ARCH}"
          echo "TARGET_OS: ${TARGET_OS}"
          echo "TARGET_ABI: ${TARGET_ABI}"
          echo "TARGET_GCC_FLAGS: ${TARGET_GCC_FLAGS}"

          rebar3 deps
          mkdir -p artifacts

          # Two tarballs per target: the ordinary one, and one with the LiteRT
          # API compiled in. The LiteRT build is not the default because it is
          # larger and reaches more of the runtime, and it cannot be the only
          # one for the same reason; publishing only the ordinary one would
          # leave every LiteRT function answering "not compiled into this
          # build" for anyone who installs the normal way, which is everyone.
          # TFLITE_BEAM_ENABLE_LITERT_API picks between them at install time and
          # is the same variable that turns it on in a source build.
          #
          # The plain build goes first, so a LiteRT failure on a new target
          # cannot cost the tarball that everything already depends on.
          TARGET_TRIPLET=${{ matrix.pair.arch_name }}-${{ matrix.pair.target_os }}-${{ matrix.pair.target_abi }}
          for VARIANT in "" "-litert"; do
            if [ "${VARIANT}" = "-litert" ]; then
              export TFLITE_BEAM_ENABLE_LITERT_API="true"
            else
              export TFLITE_BEAM_ENABLE_LITERT_API="false"
            fi
            echo "=== building ${TARGET_TRIPLET}${VARIANT} (LiteRT: ${TFLITE_BEAM_ENABLE_LITERT_API}) ==="
            rm -rf _build/default/lib/tflite_beam/cmake_tflite_beam priv/tflite_beam.so
            rebar3 compile
            export PKG_NAME=tflite_beam-nif-${NIF_VERSION}-${TARGET_TRIPLET}${VARIANT}-${GITHUB_REF##*/}
            mkdir -p "${PKG_NAME}"
            cp -a ./priv "${PKG_NAME}"
            tar -czf "${PKG_NAME}.tar.gz" "${PKG_NAME}"
            rm -rf "${PKG_NAME}"
            ls -lah "${PKG_NAME}.tar.gz"
            mv "${PKG_NAME}.tar.gz" artifacts
          done

      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: artifacts/tflite_beam-*.tar.gz
          # Without this every tag publishes as a full release and takes over
          # "Latest", so /releases/latest answered with a release candidate
          # while the README told people to install the stable one.
          #
          # Testing for '-rc' was not enough: the throwaway tags this workflow is
          # dry-run with, precompile-test and friends, carry no '-rc' either, so
          # each one published as a full release and took "Latest" with it. One
          # from August is still sitting there holding it. Only a bare vX.Y.Z is
          # a release now; everything else, rc or dry run, is a pre-release.
          prerelease: ${{ !startsWith(github.ref_name, 'v') || contains(github.ref_name, '-') }}
